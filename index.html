<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4A34">
<title>Caja Omaguas San Francisco</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde-900:#122B1D;
  --verde-800:#1E4A34;
  --verde-700:#2C6B49;
  --verde-500:#5BA37A;
  --verde-100:#DCEEE2;
  --oro-500:#D4A24C;
  --oro-300:#E8C583;
  --rio-600:#3B7EA1;
  --rio-100:#DCEBF2;
  --crema:#F7F4EC;
  --crema-2:#EFEADB;
  --tinta:#1F2A22;
  --tinta-suave:#5A6B5E;
  --rojo:#B5473A;
  --borde:#D8D0BC;
  --radio:14px;
  --sombra:0 2px 10px rgba(18,43,29,.08);
  --font-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Work Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body);
  background:var(--crema);
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:var(--font-disp);font-weight:600;letter-spacing:-0.01em}
button{font-family:inherit}
a{color:var(--verde-700)}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex-shrink:0;background:var(--verde-900);color:var(--crema);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:22px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .ring-logo{width:38px;height:38px;margin-bottom:8px}
.brand h1{font-size:16px;line-height:1.25;margin:0 0 2px;color:#fff}
.brand .sub{font-size:11px;color:var(--oro-300);letter-spacing:.04em;text-transform:uppercase}
nav.tabs{flex:1;padding:10px 10px}
nav.tabs button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:rgba(247,244,236,.78);
  padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:2px;
  transition:background .15s;
}
nav.tabs button:hover{background:rgba(255,255,255,.06)}
nav.tabs button.active{background:var(--verde-700);color:#fff;font-weight:600}
nav.tabs .icon{width:18px;text-align:center;font-size:15px}
.status-box{margin:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:11.5px;color:rgba(247,244,236,.75)}
.status-box .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.on{background:#79C99B}
.dot.off{background:#D4A24C}

main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1180px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:26px}
.topbar p.desc{margin:4px 0 0;color:var(--tinta-suave);font-size:14px;max-width:620px}

.btn{
  display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;
  padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .1s, box-shadow .15s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--verde-700);color:#fff}
.btn-primary:hover{background:var(--verde-800)}
.btn-gold{background:var(--oro-500);color:var(--verde-900)}
.btn-gold:hover{background:var(--oro-300)}
.btn-ghost{background:transparent;border:1.5px solid var(--borde);color:var(--tinta)}
.btn-ghost:hover{background:var(--crema-2)}
.btn-danger{background:#fff;border:1.5px solid var(--rojo);color:var(--rojo)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}

.card{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px}
.stat-card{background:#fff;border:1px solid var(--borde);border-radius:var(--radio);padding:16px 18px;position:relative;overflow:hidden}
.stat-card .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta-suave);font-weight:600}
.stat-card .val{font-family:var(--font-disp);font-size:26px;margin-top:6px;color:var(--verde-900)}
.stat-card .sub{font-size:12px;color:var(--tinta-suave);margin-top:4px}
.stat-card.warn .val{color:var(--rojo)}
.stat-card::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--verde-100);opacity:.6;z-index:0}
.stat-card.warn::after{background:#F6E3DF}
.stat-card *{position:relative;z-index:1}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:9px 10px;background:var(--crema-2);color:var(--verde-900);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--borde)}
td{padding:9px 10px;border-bottom:1px solid var(--borde)}
tr:hover td{background:var(--verde-100)}
.table-wrap{overflow-x:auto;border-radius:var(--radio);border:1px solid var(--borde)}
.table-wrap table{border-radius:var(--radio);overflow:hidden}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.02em}
.badge.ok{background:var(--verde-100);color:var(--verde-800)}
.badge.warn{background:#FBEBD9;color:#8A5A17}
.badge.bad{background:#F6DEDA;color:var(--rojo)}
.badge.info{background:var(--rio-100);color:var(--rio-600)}
.badge.neutral{background:#EEEEEE;color:#555}

/* ---------- Forms ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--verde-900);margin-bottom:5px}
.field .hint{font-size:11px;color:var(--tinta-suave);margin-top:3px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1.5px solid var(--borde);border-radius:9px;
  font-size:13.5px;font-family:inherit;background:#fff;color:var(--tinta);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde-500);outline-offset:1px;border-color:var(--verde-500)}
textarea{resize:vertical;min-height:70px}

.modal-bg{position:fixed;inset:0;background:rgba(18,43,29,.55);display:none;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;z-index:100}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:24px 26px 26px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 4px}
.modal .modal-desc{font-size:13px;color:var(--tinta-suave);margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.tabs-row{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--borde)}
.tabs-row button{
  background:none;border:none;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--tinta-suave);
  cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
.tabs-row button.active{color:var(--verde-800);border-color:var(--oro-500)}

.empty{text-align:center;padding:50px 20px;color:var(--tinta-suave)}
.empty .big{font-size:34px;margin-bottom:8px}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--verde-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:slidein .2s ease}
.toast.err{background:var(--rojo)}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.searchbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.searchbar input,.searchbar select{max-width:260px}

.pill-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill-nav button{background:#fff;border:1.5px solid var(--borde);padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tinta-suave)}
.pill-nav button.active{background:var(--verde-800);border-color:var(--verde-800);color:#fff}

/* mobile top nav */
.mobile-top{display:none}
.hamburger{display:none}

@media(max-width:880px){
  #app{flex-direction:column}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:250px;z-index:150;
    transform:translateX(-100%);transition:transform .2s ease;
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-top{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--verde-900);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:120;
  }
  .mobile-top .brand2{display:flex;align-items:center;gap:8px;font-family:var(--font-disp);font-size:15px}
  .hamburger{display:block;background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
  main{padding:18px 14px 50px}
  .grid-4{grid-template-columns:1fr 1fr}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:140;display:none}
  .overlay.show{display:block}
}

/* Print styles for documents */
.print-only{display:none}
@media print{
  body *{visibility:hidden}
  #printArea{display:block!important;visibility:visible;position:absolute;left:0;top:0;width:100%;padding:20px;background:#fff}
  #printArea *{visibility:visible}
  .no-print{display:none!important}
}
#printArea{display:none}
.doc-page{font-family:'Georgia',serif;color:#222;line-height:1.55;font-size:13.5px;max-width:760px;margin:0 auto}
.doc-page h2{text-align:center;font-family:var(--font-disp);margin-bottom:2px}
.doc-page .doc-sub{text-align:center;color:#555;font-size:12px;margin-bottom:18px}
.doc-page table{margin:14px 0}
.doc-page td,.doc-page th{border:1px solid #999;padding:6px 8px;font-size:12.5px}
.doc-line{border-bottom:1px solid #333;display:inline-block;min-width:160px;padding:0 4px}
.doc-signs{display:flex;justify-content:space-between;margin-top:60px;gap:30px}
.doc-signs div{flex:1;text-align:center;border-top:1px solid #333;padding-top:6px;font-size:12px}

.leaf-divider{height:1px;background:linear-gradient(90deg,transparent,var(--oro-500),transparent);margin:24px 0}
.helptext{font-size:12.5px;color:var(--tinta-suave);background:var(--verde-100);border-radius:10px;padding:10px 13px;margin-bottom:16px}
</style>

<body>

<div id="installBanner" class="no-print" style="display:none;background:var(--oro-500);color:var(--verde-900);padding:11px 14px;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer" onclick="triggerInstall()">
  📲 Esta app se puede instalar en tu celular — toca aquí para instalarla
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="ring-logo" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#D4A24C" stroke-width="2.4"/><circle cx="20" cy="20" r="11" fill="none" stroke="#5BA37A" stroke-width="2.4"/><circle cx="20" cy="20" r="4" fill="#D4A24C"/></svg>
      <h1>Caja Omaguas<br>San Francisco</h1>
      <div class="sub">Ahorro &amp; Crédito Comunitario</div>
    </div>
    <nav class="tabs" id="navTabs"></nav>
    <div class="status-box" id="statusBox">
      <span class="dot on" id="connDot"></span><span id="connTxt">Conectado</span><br>
      <span id="lastSaveTxt" style="opacity:.8">Datos guardados en este dispositivo</span>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div class="mobile-top">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <div class="brand2">🌿 Caja OSF</div>
      <span id="connDotMobile" style="font-size:11px">●</span>
    </div>
    <main id="mainContent"></main>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="printArea"></div>

<script>
/* =========================================================================
   CAJA DE AHORRO Y CRÉDITO — OMAGUAS "SAN FRANCISCO"
   Aplicación offline-first. Todos los datos se guardan en este dispositivo
   (localStorage). No requiere internet para funcionar. El respaldo/],
   restauración permite compartir datos entre dispositivos cuando haya señal.
   ========================================================================= */

const DB_KEY = 'cajaOSF_v1';
const CFG_DEFAULT = {
  aporteInicial: 60,
  aporteMensual: 1,
  aporteMaximo: 100,
  tasaSocio: 12,       // % anual
  tasaNoSocio: 15,     // % anual
  montoMin: 100,
  montoMaxSocio: 1000,
  montoMaxNoSocio: 500,
  moraDiaria: 0.25,
  desgravamenPorMes: 0.25,
  tasaAhorro: 3,        // % anual
  ahorroMinimo: 100,
  ahorroPlazoMinMeses: 12,
  multaAtraso: 0.25,
  multaInasistencia: 5,
  multaDesorden: 1,
  nombreCaja: 'CAJA DE AHORRO Y CRÉDITO OMAGUAS "SAN FRANCISCO"',
  comunidad: 'Omagua San Francisco',
  parroquia: 'Enokanqui',
  canton: 'La Joya de los Sachas',
  provincia: 'Orellana',
  googleSheetsUrl: '',
  googleSheetsAutoSync: false,
  googleSheetsUltimaSync: '',
  googleSheetsUltimoResultado: ''
};

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return 'US$ ' + (Number(n)||0).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- Estado global ---------- */
let DB = loadDB();
let currentTab = 'dashboard';
let printAfterLoad = false;

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      parsed.config = Object.assign({}, CFG_DEFAULT, parsed.config||{});
      parsed.socios = parsed.socios||[];
      parsed.creditos = parsed.creditos||[];
      parsed.ahorros = parsed.ahorros||[];
      parsed.movAhorros = parsed.movAhorros||[];
      parsed.multas = parsed.multas||[];
      parsed.fondos = Object.assign({ social:0, desgravamen:0, riesgos:0 }, parsed.fondos||{});
      return parsed;
    }
  }catch(e){ console.error('Error cargando datos', e); }
  return { socios:[], creditos:[], ahorros:[], movAhorros:[], multas:[], fondos:{social:0,desgravamen:0,riesgos:0}, config: Object.assign({},CFG_DEFAULT) };
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  const t = document.getElementById('lastSaveTxt');
  if(t) t.textContent = 'Guardado ' + new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
  if(DB.config.googleSheetsUrl && DB.config.googleSheetsAutoSync){
    clearTimeout(window._syncTimeout);
    window._syncTimeout = setTimeout(()=>sincronizarGoogleSheets(false), 3500);
  }
}

/* ---------- Navegación ---------- */
const TABS = [
  {id:'dashboard', label:'Panel General', icon:'🏠'},
  {id:'socios', label:'Socios', icon:'🧑‍🌾'},
  {id:'aportes', label:'Aportes de Capital', icon:'🪙'},
  {id:'ahorros', label:'Ahorros', icon:'💧'},
  {id:'creditos', label:'Créditos', icon:'🌱'},
  {id:'multas', label:'Multas y Asambleas', icon:'⚖️'},
  {id:'documentos', label:'Documentos', icon:'📄'},
  {id:'config', label:'Configuración', icon:'⚙️'},
  {id:'respaldo', label:'Respaldo de datos', icon:'🔄'},
  {id:'sheets', label:'Google Sheets', icon:'📊'},
];

function renderNav(){
  const nav = document.getElementById('navTabs');
  nav.innerHTML = TABS.map(t=>`<button class="${t.id===currentTab?'active':''}" onclick="goTab('${t.id}')"><span class="icon">${t.icon}</span> ${t.label}</button>`).join('');
}
function goTab(id){ currentTab = id; closeSidebar(); render(); window.scrollTo(0,0); }
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

function toast(msg, err){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (err?' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------- Utilidades de negocio ---------- */
function sociosActivos(){ return DB.socios.filter(s=>s.estado==='activo'); }
function socioById(id){ return DB.socios.find(s=>s.id===id); }
function totalAportesSocio(socio){ return (socio.aportes||[]).reduce((a,x)=>a+Number(x.monto),0); }
function totalCapitalSocial(){ return DB.socios.reduce((a,s)=>a+totalAportesSocio(s),0); }

function tasaParaSolicitante(esSocio){ return esSocio ? DB.config.tasaSocio : DB.config.tasaNoSocio; }
function montoMaxParaSolicitante(esSocio){ return esSocio ? DB.config.montoMaxSocio : DB.config.montoMaxNoSocio; }

function plazoSugerido(monto){
  // según Art. 5 del reglamento de créditos
  if(monto <= 100) return {min:1,max:3};
  if(monto < 500) return {min:1,max:6};
  return {min:8,max:12};
}

// Amortización sistema francés (cuota fija, capital + interés)
function calcularAmortizacion(monto, tasaAnualPct, plazoMeses, fechaInicioISO){
  const i = (tasaAnualPct/100)/12;
  const n = plazoMeses;
  let cuota;
  if(i === 0){ cuota = monto/n; } else { cuota = monto * (i * Math.pow(1+i,n)) / (Math.pow(1+i,n)-1); }
  let saldo = monto;
  const tabla = [];
  const fInicio = fechaInicioISO ? new Date(fechaInicioISO+'T00:00:00') : new Date();
  for(let k=1;k<=n;k++){
    const interes = saldo * i;
    let capital = cuota - interes;
    if(k===n){ capital = saldo; cuota = capital+interes; }
    saldo = Math.max(0, saldo - capital);
    const venc = new Date(fInicio); venc.setMonth(venc.getMonth()+k);
    tabla.push({
      numero:k,
      fechaVenc: venc.toISOString().slice(0,10),
      cuota: round2(capital+interes),
      capital: round2(capital),
      interes: round2(interes),
      saldo: round2(saldo),
      pagado:false, fechaPago:null, moraPagada:0
    });
  }
  return tabla;
}
function round2(n){ return Math.round(n*100)/100; }

function diasMora(fechaVencISO){
  const venc = new Date(fechaVencISO+'T00:00:00');
  const hoy = new Date(todayISO()+'T00:00:00');
  const diff = Math.floor((hoy-venc)/86400000);
  return diff>0?diff:0;
}
// Mora "base" antes de condonaciones o cobros manuales — depende del modo elegido para el crédito.
function moraBaseCredito(cred){
  const tabla = cred.tabla||[];
  if(!tabla.length) return 0;
  if(cred.modoMora === 'alFinalPlazo'){
    // Solo se calcula mora cuando ya venció la ÚLTIMA cuota del plazo, sobre el saldo pendiente total.
    const ultima = tabla[tabla.length-1];
    const dias = diasMora(ultima.fechaVenc);
    if(dias<=0) return 0;
    return round2(dias * DB.config.moraDiaria);
  }
  // Modo por cuota (por defecto): cada cuota vencida genera mora desde su propia fecha.
  return round2(tabla.filter(c=>!c.pagado).reduce((a,c)=>a + diasMora(c.fechaVenc)*DB.config.moraDiaria, 0));
}
// Mora de una cuota individual (solo aplica en modo "por cuota"; se usa para mostrar/columna en la tabla).
function moraCuota(cuota){
  if(cuota.pagado) return 0;
  const dias = diasMora(cuota.fechaVenc);
  return round2(dias * DB.config.moraDiaria);
}
function creditoEnMora(cred){
  if(cred.modoMora === 'alFinalPlazo'){
    const tabla = cred.tabla||[]; const ultima = tabla[tabla.length-1];
    return !!ultima && !ultima.pagado && diasMora(ultima.fechaVenc)>0 && (cred.tabla||[]).some(c=>!c.pagado);
  }
  return (cred.tabla||[]).some(c=>!c.pagado && diasMora(c.fechaVenc)>0);
}
function saldoCredito(cred){
  return round2((cred.tabla||[]).filter(c=>!c.pagado).reduce((a,c)=>a+c.capital,0));
}
// Mora neta pendiente de cobro: mora base, menos lo ya condonado y menos lo ya cobrado manualmente.
function totalMoraCredito(cred){
  const base = moraBaseCredito(cred);
  const ajustado = base - (cred.moraCondonadaAcum||0) - (cred.moraPagadaManualAcum||0);
  return round2(Math.max(0, ajustado));
}
function registrarCobroMoraManual(credId){
  const c = DB.creditos.find(x=>x.id===credId); if(!c) return;
  const pendiente = totalMoraCredito(c);
  const monto = prompt(`Mora pendiente actual: ${fmt(pendiente)}\n\n¿Cuánto se cobra hoy por mora?`, pendiente.toFixed(2));
  if(monto===null) return;
  const val = Number(monto);
  if(!val || val<=0){ toast('Monto inválido','err'); return; }
  c.moraPagadaManualAcum = round2((c.moraPagadaManualAcum||0) + val);
  c.historialMora = c.historialMora||[];
  c.historialMora.push({id:uid('hm'), fecha:todayISO(), tipo:'cobro', monto:val, motivo:'Cobro de mora registrado manualmente'});
  // Distribución según Art. 15: 50% fondo de crédito (no se lleva registro aparte), 25% riesgos, 25% fondo social
  DB.fondos.social = round2(DB.fondos.social + val*0.25);
  DB.fondos.riesgos = round2(DB.fondos.riesgos + val*0.25);
  saveDB(); toast('Cobro de mora registrado'); openCreditoDetalle(credId);
}
function condonarMora(credId){
  const c = DB.creditos.find(x=>x.id===credId); if(!c) return;
  const pendiente = totalMoraCredito(c);
  if(pendiente<=0){ toast('No hay mora pendiente para condonar','err'); return; }
  const tipo = prompt('¿Condonación TOTAL o PARCIAL?\nEscriba: total  o  parcial', 'parcial');
  if(tipo===null) return;
  const t = tipo.trim().toLowerCase();
  let montoCondonado = 0, detalle='';
  if(t==='total'){
    montoCondonado = pendiente; detalle = 'Condonación total de la mora, autorizada por la directiva';
  } else if(t==='parcial'){
    const pct = prompt(`Mora pendiente: ${fmt(pendiente)}\n¿Qué porcentaje se condona? (ej: 50)`, '50');
    if(pct===null) return;
    const p = Number(pct);
    if(!p || p<=0 || p>100){ toast('Porcentaje inválido','err'); return; }
    montoCondonado = round2(pendiente * p/100);
    detalle = `Condonación parcial del ${p}% de la mora, autorizada por la directiva`;
  } else { toast('Escriba "total" o "parcial"','err'); return; }
  const motivo = prompt('Motivo / referencia del acuerdo (opcional):','') || '';
  c.moraCondonadaAcum = round2((c.moraCondonadaAcum||0) + montoCondonado);
  c.historialMora = c.historialMora||[];
  c.historialMora.push({id:uid('hm'), fecha:todayISO(), tipo:'condonacion', monto:montoCondonado, motivo: motivo?`${detalle} — ${motivo}`:detalle});
  saveDB(); toast(`Mora condonada: ${fmt(montoCondonado)}`); openCreditoDetalle(credId);
}
function cambiarModoMora(credId, valor){
  const c = DB.creditos.find(x=>x.id===credId); if(!c) return;
  c.modoMora = valor; saveDB(); toast('Forma de cálculo de mora actualizada'); openCreditoDetalle(credId);
}
/* ---- Semáforo de créditos: verde = al día, amarillo = por vencer, rojo = vencido/mora ---- */
function proximaCuotaPendiente(cred){ return (cred.tabla||[]).find(t=>!t.pagado); }
function creditoSemaforo(cred){
  if(cred.estado!=='desembolsado') return 'gris';
  if(creditoEnMora(cred)) return 'rojo';
  const prox = proximaCuotaPendiente(cred);
  if(!prox) return 'verde';
  const dias = Math.ceil((new Date(prox.fechaVenc+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  if(dias<=5) return 'amarillo';
  return 'verde';
}
function semaforoDot(color){
  const map = {rojo:'#B5473A', amarillo:'#D4A24C', verde:'#5BA37A', gris:'#B9B9B9'};
  return `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${map[color]||'#B9B9B9'};margin-right:6px;vertical-align:middle"></span>`;
}
function carteraTotal(){
  return DB.creditos.filter(c=>c.estado==='desembolsado').reduce((a,c)=>a+saldoCredito(c),0);
}
// Cartera vigente = saldo de créditos desembolsados SIN cuotas vencidas (semáforo verde o amarillo).
function carteraVigente(){
  return round2(DB.creditos.filter(c=>c.estado==='desembolsado' && !creditoEnMora(c)).reduce((a,c)=>a+saldoCredito(c),0));
}
// Cartera vencida = saldo de capital de créditos con al menos una cuota vencida (semáforo rojo).
function carteraVencida(){
  return round2(DB.creditos.filter(c=>c.estado==='desembolsado' && creditoEnMora(c)).reduce((a,c)=>a+saldoCredito(c),0));
}
// Cartera de moras = total de intereses moratorios pendientes de cobro (no es capital, es la multa por atraso).
function carteraMorasAcumuladas(){
  return round2(DB.creditos.filter(c=>c.estado==='desembolsado').reduce((a,c)=>a+totalMoraCredito(c),0));
}
function carteraMora(){ return carteraVencida(); } // alias retrocompatible
// Cartera de interés = interés total programado en todos los créditos entregados (vigentes + cancelados).
function carteraInteres(){
  return round2(DB.creditos.filter(c=>c.estado==='desembolsado'||c.estado==='cancelado').reduce((a,c)=>a+(c.tabla||[]).reduce((x,t)=>x+t.interes,0),0));
}
function interesCobradoCreditos(){
  return round2(DB.creditos.reduce((a,c)=>a+(c.pagosRegistrados||[]).reduce((x,p)=>x+(p.interes||0),0),0));
}
function totalAhorros(){
  return DB.ahorros.filter(a=>a.estado!=='cerrado').reduce((a,x)=>a+x.saldo,0);
}
function totalAhorroPorTipo(tipo){
  return round2(DB.ahorros.filter(a=>a.tipo===tipo && a.estado!=='cerrado').reduce((a,x)=>a+x.saldo,0));
}
function totalMovAhorro(tipo){
  return round2(DB.movAhorros.filter(m=>m.tipo===tipo).reduce((a,m)=>a+Number(m.monto),0));
}

}

function separarSocio(id){
  const s = socioById(id); if(!s) return;
  if(!confirm('¿Confirma separar a este socio de la caja (Art. 5)?')) return;
  s.estado='separado'; saveDB(); toast('Socio separado'); closeModal(); renderSociosTabla();
}
function eliminarSocio(id){
  const s = socioById(id); if(!s) return;
  const cred = DB.creditos.filter(c=>c.solicitanteId===id);
  const ahorrosSocio = DB.ahorros.filter(a=>a.socioId===id);
  let msg = `¿Eliminar definitivamente a "${s.nombres}"? Esta acción no se puede deshacer.`;
  if(cred.length || ahorrosSocio.length){
    msg += `\n\nTambién se eliminarán sus ${cred.length} crédito(s) y ${ahorrosSocio.length} cuenta(s) de ahorro asociadas.`;
  }
  if(!confirm(msg)) return;
  // revertir aportes al fondo de desgravamen de los créditos que se van a borrar
  cred.forEach(c=>{ if(c.aporteDesgravamen) DB.fondos.desgravamen = round2(Math.max(0, DB.fondos.desgravamen - c.aporteDesgravamen)); });
  DB.creditos = DB.creditos.filter(c=>c.solicitanteId!==id);
  const ahorroIds = ahorrosSocio.map(a=>a.id);
  DB.ahorros = DB.ahorros.filter(a=>a.socioId!==id);
  DB.movAhorros = DB.movAhorros.filter(m=>!ahorroIds.includes(m.ahorroId));
  DB.multas = DB.multas.filter(m=>m.socioId!==id);
  DB.socios = DB.socios.filter(x=>x.id!==id);
  saveDB(); toast('Socio eliminado'); closeModal(); renderSocios(document.getElementById('mainContent'));
}

  DB.ahorros = DB.ahorros.filter(x=>x.id!==id);
  DB.movAhorros = DB.movAhorros.filter(m=>m.ahorroId!==id);
  saveDB(); toast('Cuenta de ahorro eliminada'); closeModal(); renderAhorrosTabla();

function movAhorro(ahorroId, tipo){
  const labels = {deposito:'Monto a depositar (US$):', retiro:'Monto a retirar (US$):', interes:'Monto de interés a acreditar (US$):'};
  const monto = prompt(labels[tipo]);
  if(monto===null) return;
  const val = Number(monto);
  if(!val || val<=0){ toast('Monto inválido','err'); return; }
  const a = DB.ahorros.find(x=>x.id===ahorroId); if(!a) return;
  if(tipo==='retiro' && val>a.saldo){ toast('El monto excede el saldo disponible','err'); return; }
  const signo = tipo==='retiro' ? -1 : 1;
  a.saldo = round2(a.saldo + signo*val);
  DB.movAhorros.push({id:uid('mv'), ahorroId, fecha:todayISO(), tipo, monto:val});
  saveDB(); toast('Movimiento registrado'); closeModal(); openAhorroDetalle(ahorroId);
}

function filtrarCreditos(k){
  window._credFiltro = k;
  document.querySelectorAll('#credFiltroPills button').forEach(b=>b.classList.toggle('active', b.dataset.k===k));

  if(estado==='desembolsado'){

  if(!sel) return;

      </div>

function eliminarCredito(id){
  const c = DB.creditos.find(x=>x.id===id); if(!c) return;
  if(!confirm(`¿Eliminar definitivamente el crédito #${c.numero}? Esta acción no se puede deshacer.`)) return;
  if(c.aporteDesgravamen) DB.fondos.desgravamen = round2(Math.max(0, DB.fondos.desgravamen - c.aporteDesgravamen));
  DB.creditos = DB.creditos.filter(x=>x.id!==id);
  saveDB(); toast('Crédito eliminado'); closeModal(); renderCreditosTabla();
}
function resolverCredito(id, decision){
  const c = DB.creditos.find(x=>x.id===id); if(!c) return;
  if(decision==='rechazado'){
    c.estado='rechazado'; saveDB(); toast('Solicitud rechazada'); closeModal(); renderCreditosTabla(); return;
  }
  c.estado='aprobado'; c.fechaAprobacion = todayISO();
  saveDB(); toast('Credito aprobado por el Comite de Credito'); closeModal(); openCreditoDetalle(id);
}
function desembolsarCredito(id){
  const c = DB.creditos.find(x=>x.id===id); if(!c) return;
  showModal('Registrar desembolso', 'Confirme la fecha real de entrega del dinero. Se generara la tabla de amortizacion a partir de esa fecha.', `
    <form id="desembolsoForm">
      <div class="field"><label>Fecha de desembolso *</label><input type="date" name="fechaDesembolso" required value="${todayISO()}"></div>
    </form>
  `, ()=>{
    const f = document.getElementById('desembolsoForm'); const d = Object.fromEntries(new FormData(f).entries());
    c.fechaDesembolso = d.fechaDesembolso;
    c.tabla = calcularAmortizacion(c.monto, c.tasaInteres, c.plazoMeses, c.fechaDesembolso);
    c.estado = 'desembolsado';
    const aporteDesgravamen = round2(DB.config.desgravamenPorMes * c.plazoMeses);
    DB.fondos.desgravamen = round2(DB.fondos.desgravamen + aporteDesgravamen);
    c.aporteDesgravamen = aporteDesgravamen;
    saveDB(); toast('Credito desembolsado - tabla de amortizacion generada');
    setTimeout(()=>openCreditoDetalle(id),50);
    return true;
  });
}
function registrarPagoCuota(credId, numero){
  const c = DB.creditos.find(x=>x.id===credId); if(!c) return;
  const cuota = c.tabla.find(t=>t.numero===numero); if(!cuota || cuota.pagado) return;
  if(!confirm(`Registrar pago de la cuota #${numero}\nCapital: ${fmt(cuota.capital)}\nInteres: ${fmt(cuota.interes)}\nTotal cuota: ${fmt(cuota.cuota)}\n\n(La mora, si existiera, se cobra o condona por separado con los botones de "Mora" del credito.)`)) return;
  cuota.pagado = true; cuota.fechaPago = todayISO();
  c.pagosRegistrados = c.pagosRegistrados||[];
  c.pagosRegistrados.push({fecha:todayISO(), cuota:numero, capital:cuota.capital, interes:cuota.interes, mora:0, total:cuota.cuota});
  if(c.tabla.every(t=>t.pagado)) c.estado = 'cancelado';
  saveDB(); toast('Pago registrado'); openCreditoDetalle(credId);
}

const TIPO_MULTA_INFO = {
  atraso:     {label:'Atraso a asamblea (< 30 min)', cfgKey:'multaAtraso', art:'Art. 8a'},
  inasistencia:{label:'Falta injustificada a asamblea', cfgKey:'multaInasistencia', art:'Art. 8b/d'},
  desorden:   {label:'Desorden / interrupción en asamblea', cfgKey:'multaDesorden', art:'Art. 8g'},
  otro:       {label:'Otra sanción acordada en asamblea', cfgKey:null, art:'Art. 8'},
};
function montoSugeridoMulta(tipo){ const info = TIPO_MULTA_INFO[tipo]; return info && info.cfgKey ? DB.config[info.cfgKey] : 0; }
function inasistenciasInjustificadasAnio(socioId, anio){
  return DB.multas.filter(m=>m.socioId===socioId && m.tipo==='inasistencia' && !m.justificada && m.fecha.slice(0,4)===String(anio)).length;
}
function totalMultasPendientes(){ return round2(DB.multas.filter(m=>!m.pagada).reduce((a,m)=>a+Number(m.monto),0)); }

function renderMultas(main){
  const anioActual = new Date().getFullYear();
  main.innerHTML = `
    <div class="topbar">

    </div>

    <div id="multasTablaWrap"></div>

function sociosEnRiesgoSeparacion(){
  const anio = new Date().getFullYear();
  return sociosActivos().filter(s=>inasistenciasInjustificadasAnio(s.id, anio) >= 3);
}
function renderMultasTabla(){
  const wrap = document.getElementById('multasTablaWrap'); if(!wrap) return;
  const fEstado = document.getElementById('multaFiltroEstado')?.value||'todas';
  const fTipo = document.getElementById('multaFiltroTipo')?.value||'todos';
  let list = DB.multas.filter(m=>{
    const okE = fEstado==='todas' || (fEstado==='pendiente'?!m.pagada:m.pagada);
    const okT = fTipo==='todos' || m.tipo===fTipo;
    return okE && okT;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!list.length){ wrap.innerHTML = `<div class="empty"><div class="big">⚖️</div>No hay multas registradas con este filtro.</div>`; return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Socio</th><th>Sanción</th><th>Motivo</th><th>Monto</th><th>Estado</th><th></th></tr></thead><tbody>

    const s = socioById(m.socioId);
    const info = TIPO_MULTA_INFO[m.tipo]||{label:m.tipo};
    return `<tr><td>${fmtDate(m.fecha)}</td><td>${esc(s?s.nombres:'—')}</td><td>${info.label}${m.justificada?' <span class="badge neutral">Justificada</span>':''}</td>

    <td>${m.pagada?'—':`<button class="btn btn-sm btn-primary" onclick="pagarMulta('${m.id}')">Registrar pago</button>`}</td></tr>`;
  }).join('')}
  </tbody></table></div>`;
}

function pagarMulta(id){

/* ---- Generadores de documentos imprimibles ---- */
function fechaLarga(iso){
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const d = new Date((iso||todayISO())+'T00:00:00');
  return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}
function printDoc(html){
  document.getElementById('printArea').innerHTML = html;
  showDocPreview(html);
}
function showDocPreview(html){
  let bg = document.getElementById('docModalBg');
  if(!bg){
    bg = document.createElement('div'); bg.id='docModalBg'; bg.className='modal-bg';
    bg.innerHTML = `<div class="modal" id="docModalInner" style="max-width:840px"></div>`;
    document.body.appendChild(bg);
    bg.addEventListener('click',(e)=>{ if(e.target===bg) closeDocModal(); });
  }
  document.getElementById('docModalInner').innerHTML = `
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <h3 style="margin:0">Vista previa del documento</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gold btn-sm" onclick="window.print()">Imprimir / Guardar PDF</button>
        <button class="btn btn-ghost btn-sm" onclick="closeDocModal()">Cerrar</button>
      </div>
    </div>
    <div style="border:1px solid var(--borde);border-radius:10px;padding:26px;max-height:68vh;overflow-y:auto;background:#fdfcf8">${html}</div>
  `;
  bg.classList.add('show');
}
function closeDocModal(){ const bg = document.getElementById('docModalBg'); if(bg) bg.classList.remove('show'); }

function construirPayloadSheets(){
  const socios = DB.socios.map(s=>({
    nombre: s.nombres, cedula: s.cedula||'', tipo: s.esComunidad?'Socio comunidad':'Cliente/usuario', estado: s.estado,
    aporteCapital: totalAportesSocio(s),
    ahorroVoluntario: round2(DB.ahorros.filter(a=>a.socioId===s.id && a.tipo==='voluntario' && a.estado!=='cerrado').reduce((a,x)=>a+x.saldo,0)),
    ahorroPlazo: round2(DB.ahorros.filter(a=>a.socioId===s.id && a.tipo==='plazo' && a.estado!=='cerrado').reduce((a,x)=>a+x.saldo,0)),
    saldoCreditos: round2(DB.creditos.filter(c=>c.solicitanteId===s.id && c.estado==='desembolsado').reduce((a,c)=>a+saldoCredito(c),0)),
    moraPendiente: round2(DB.creditos.filter(c=>c.solicitanteId===s.id && c.estado==='desembolsado').reduce((a,c)=>a+totalMoraCredito(c),0)),
  }));
  const resumen = {
    'Capital social total': totalCapitalSocial(),
    'Ahorro total': totalAhorros(),
    'Cartera vigente': carteraVigente(),
    'Cartera vencida': carteraVencida(),
    'Cartera de moras pendientes': carteraMorasAcumuladas(),
    'Fondo social': DB.fondos.social,
    'Fondo de desgravamen': DB.fondos.desgravamen,
    'Fondo de gestion de riesgos': DB.fondos.riesgos,
  };
  return { fechaSync: new Date().toLocaleString('es-EC'), socios, resumen };
}
async function sincronizarGoogleSheets(manual){
  const url = (DB.config.googleSheetsUrl||'').trim();
  if(!url){ if(manual) toast('Primero configure la URL del Web App de Google Apps Script','err'); return; }
  if(!navigator.onLine){ if(manual) toast('Sin conexión — no se puede sincronizar ahora mismo. Se reintentará cuando vuelva la señal.','err'); return; }
  const payload = construirPayloadSheets();
  try{
    const resp = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    let json = {ok:true};
    try{ json = await resp.json(); }catch(_e){}
    DB.config.googleSheetsUltimaSync = new Date().toISOString();
    DB.config.googleSheetsUltimoResultado = json.ok ? `Sincronizado: ${json.socios!=null?json.socios:payload.socios.length} socio(s)` : `Error: ${json.error||'respuesta inesperada'}`;
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    if(manual) toast(json.ok ? 'Sincronizado con Google Sheets correctamente' : 'Google Sheets respondió con un error — revise el código pegado en Apps Script', !json.ok);
  }catch(err){
    DB.config.googleSheetsUltimoResultado = 'No se pudo conectar (revise la URL o que la implementación sea pública)';
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    if(manual) toast('No se pudo sincronizar con Google Sheets','err');
  }
  if(currentTab==='sheets') renderGoogleSheets(document.getElementById('mainContent'));
}
function guardarConfigSheets(){
  const url = document.getElementById('sheetsUrlInput').value.trim();
  const auto = document.getElementById('sheetsAutoChk').checked;
  DB.config.googleSheetsUrl = url;
  DB.config.googleSheetsAutoSync = auto;
  saveDB(); toast('Configuración de Google Sheets guardada');
}

  navigator.clipboard.writeText(GOOGLE_SCRIPT_CODE).then(()=>toast('Código copiado — péguelo en Apps Script')).catch(()=>toast('No se pudo copiar automáticamente; selecciónelo y copie manualmente','err'));
}

  main.innerHTML = `
    <div class="topbar"><div><h2>Respaldo de datos</h2><p class="desc">La app funciona sin internet. Use esta sección para crear una copia de seguridad o pasar los datos a otro dispositivo cuando haya conexión.</p></div></div>

      <button class="btn btn-danger" onclick="reiniciarDatosOperativos()">Borrar socios, créditos y ahorros — empezar de nuevo</button>

function reiniciarDatosOperativos(){
  const totalRegistros = DB.socios.length + DB.creditos.length + DB.ahorros.length + DB.multas.length;
  if(totalRegistros===0){ toast('No hay datos operativos para borrar'); return; }
  const paso1 = confirm(`Esto eliminará ${DB.socios.length} socio(s), ${DB.creditos.length} crédito(s), ${DB.ahorros.length} cuenta(s) de ahorro y ${DB.multas.length} multa(s). La configuración de tasas y Google Sheets NO se borrará.\n\n¿Desea continuar?`);
  if(!paso1) return;
  const confirmacion = prompt('Para confirmar, escriba la palabra BORRAR (en mayúsculas):');
  if(confirmacion !== 'BORRAR'){ toast('No se realizaron cambios — el texto no coincidió','err'); return; }
  DB.socios = []; DB.creditos = []; DB.ahorros = []; DB.movAhorros = []; DB.multas = [];
  DB.fondos = { social:0, desgravamen:0, riesgos:0 };
  saveDB(); toast('Datos borrados — la app está lista para socios reales'); render();
}

function exportarRespaldo(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `respaldo-caja-osf-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado');
}
function restaurarRespaldo(){
  const inp = document.getElementById('restoreFile');
  if(!inp.files.length){ toast('Seleccione un archivo primero','err'); return; }
  if(!confirm('Esto reemplazará todos los datos actuales en este dispositivo. ¿Continuar?')) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      DB = parsed;
      DB.config = Object.assign({}, CFG_DEFAULT, DB.config||{});
      DB.socios = DB.socios||[]; DB.creditos = DB.creditos||[]; DB.ahorros = DB.ahorros||[];
      DB.movAhorros = DB.movAhorros||[]; DB.multas = DB.multas||[]; DB.fondos = DB.fondos||{social:0,desgravamen:0,riesgos:0};
      saveDB(); toast('Datos restaurados correctamente'); render();
    }catch(err){ toast('Archivo inválido','err'); }
  };
  reader.readAsText(inp.files[0]);
}

/* ================= MODAL genérico ================= */
let _modalOnConfirm = null;
function showModal(title, desc, bodyHTML, onConfirm, hideConfirm){
  let bg = document.getElementById('modalBg');
  if(!bg){
    bg = document.createElement('div'); bg.id='modalBg'; bg.className='modal-bg';
    bg.innerHTML = `<div class="modal" id="modalInner"></div>`;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e)=>{ if(e.target===bg) closeModal(); });
  }
  _modalOnConfirm = onConfirm;
  document.getElementById('modalInner').innerHTML = `
    <h3>${esc(title)}</h3>
    <div class="modal-desc">${esc(desc||'')}</div>
    ${bodyHTML}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
      ${hideConfirm?'':'<button class="btn btn-primary" onclick="confirmModal()">Guardar</button>'}
    </div>
  `;
  bg.classList.add('show');
}
function confirmModal(){
  if(_modalOnConfirm){ const ok = _modalOnConfirm(); if(ok===false) return; }
  closeModal();
}
function closeModal(){ const bg = document.getElementById('modalBg'); if(bg) bg.classList.remove('show'); }

/* ================= Conexión / offline ================= */
function updateConnStatus(){
  const online = navigator.onLine;
  const dot = document.getElementById('connDot'); const txt = document.getElementById('connTxt'); const dotM = document.getElementById('connDotMobile');
  if(dot){ dot.className = 'dot ' + (online?'on':'off'); }
  if(txt){ txt.textContent = online ? 'Conectado' : 'Sin conexión — funcionando offline'; }
  if(dotM){ dotM.style.color = online ? '#79C99B' : '#D4A24C'; }
}
window.addEventListener('online', ()=>{ updateConnStatus(); sincronizarGoogleSheets(false); });
window.addEventListener('offline', updateConnStatus);

/* ================= Instalación como app (Android/Chrome/Edge) ================= */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'block';
});
function triggerInstall(){
  const banner = document.getElementById('installBanner');
  if(!deferredInstallPrompt){
    toast('Si no aparece el instalador, use el menú (⋮) del navegador → "Instalar app" o "Agregar a pantalla de inicio"');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{
    deferredInstallPrompt = null;
    if(banner) banner.style.display = 'none';
  });
}
window.addEventListener('appinstalled', ()=>{
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
  toast('¡App instalada correctamente!');
});

/* ================= Init ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
document.addEventListener('DOMContentLoaded', ()=>{
  render();
  updateConnStatus();
  if(navigator.onLine) sincronizarGoogleSheets(false);
});
</script>
